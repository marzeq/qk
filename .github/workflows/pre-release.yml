name: Pre-releases

on:
  push:
    tags:
      - "pre.*"

permissions:
  contents: read

concurrency:
  group: pre-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  linux:
    name: Package Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LLVM 22 development packages
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 22
          sudo apt-get install --yes clang-22 llvm-22-dev libclang-22-dev libclang-cpp22-dev liblld-22-dev
          test -e /usr/lib/llvm-22/lib/libclang-cpp.so
          echo "/usr/lib/llvm-22/bin" >> "$GITHUB_PATH"
          echo "CGO_CXXFLAGS=-I/usr/lib/llvm-22/include" >> "$GITHUB_ENV"
          echo "CGO_LDFLAGS=-L/usr/lib/llvm-22/lib" >> "$GITHUB_ENV"

      - name: Build release archive
        run: scripts/package-release-linux.sh "$GITHUB_REF_NAME" dist

      - name: Upload Linux archive
        uses: actions/upload-artifact@v7
        with:
          name: qk-${{ github.ref_name }}-linux
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Package macOS
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install LLVM and LLD
        run: brew install llvm lld

      - name: Build release archive
        env:
          LLVM_CONFIG: ${{ runner.temp }}/llvm-config
        run: |
          ln -s "$(brew --prefix llvm)/bin/llvm-config" "$LLVM_CONFIG"
          scripts/package-release-macos.sh "$GITHUB_REF_NAME" dist

      - name: Upload macOS archive
        uses: actions/upload-artifact@v7
        with:
          name: qk-${{ github.ref_name }}-macos
          path: dist/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish pre-release
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v7
        with:
          pattern: qk-${{ github.ref_name }}-*
          path: dist
          merge-multiple: true

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --title "QK $GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease \
            --verify-tag
